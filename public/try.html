<!doctype html>

<html>

<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1">

<title>
Attendance Register
</title>


<link
    rel="preconnect"
    href="https://fonts.googleapis.com">


<link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">


<style>

:root {

    --paper:#faedcd;

    --card:#fffdf7;

    --ink:#432818;

    --rule:#d4a373;

    --stamp:#606c38;

    --bad:#bc4749;

    --muted:#8a7968;
}


* {

    box-sizing:border-box;

}


body {

    font-family:
        'IBM Plex Mono',
        monospace;

    background:
        var(--paper);

    background-image:

        repeating-linear-gradient(

            to bottom,

            transparent,

            transparent 31px,

            var(--rule) 32px

        );


    min-height:100vh;

    margin:0;

    display:flex;

    align-items:center;

    justify-content:center;

    color:
        var(--ink);

    padding:20px;

}


.card {

    background:
        var(--card);

    padding:
        40px 36px;

    border-radius:
        4px;

    box-shadow:

        0 4px 0
        var(--rule),

        0 6px 20px
        rgba(67,40,24,.15);


    width:100%;

    max-width:
        400px;

    text-align:center;

}


h1 {

    font-family:
        'Fraunces',
        serif;

    font-weight:
        800;

    font-size:
        24px;

    margin:
        0 0 5px;

}


.sub {

    color:
        var(--muted);

    margin:
        0 0 22px;

    font-size:
        12px;

    text-transform:
        uppercase;

}


label {

    display:block;

    text-align:left;

    font-size:
        11px;

    text-transform:
        uppercase;

    color:
        var(--muted);

    margin:
        14px 0 4px;

}


input {

    display:block;

    width:100%;

    padding:
        11px 12px;

    font-size:
        15px;

    border-radius:
        3px;

    border:
        1px solid
        var(--rule);

    background:
        white;

    color:
        var(--ink);

    font-family:
        inherit;

}


button {

    width:100%;

    padding:
        13px;

    margin-top:
        20px;

    font-size:
        14px;

    border:none;

    border-radius:
        3px;

    background:
        var(--ink);

    color:
        var(--paper);

    font-weight:
        600;

    cursor:pointer;

    font-family:
        inherit;

}


button:hover {

    background:
        var(--stamp);

}


.who {

    color:
        var(--muted);

    margin-bottom:
        20px;

    font-size:
        13px;

}


.status {

    margin:
        25px 0;

}


.stamp {

    display:
        inline-block;

    border:
        3px solid
        var(--stamp);

    color:
        var(--stamp);

    font-family:
        'Fraunces',
        serif;

    font-weight:
        800;

    text-transform:
        uppercase;

    padding:
        8px 18px;

    border-radius:
        6px;

    transform:
        rotate(-7deg);

    font-size:
        18px;

}


.error {

    color:
        var(--bad);

    font-weight:
        600;

}


.loader {

    margin:
        25px auto;

    width:
        40px;

    height:
        40px;

    border:
        4px solid
        var(--rule);

    border-top-color:
        var(--stamp);

    border-radius:
        50%;

    animation:
        spin 1s linear infinite;

}


@keyframes spin {

    to {

        transform:
            rotate(360deg);

    }

}


a {

    color:
        var(--muted);

    font-size:
        12px;

}

</style>

</head>



<body>


<div class="card">


<!-- =============================
     REGISTRATION
============================= -->

<div id="regForm">


<h1>
Student Register
</h1>


<p class="sub">
One-time profile setup
</p>


<label>
Full Name
</label>

<input id="name">


<label>
Enrolment ID
</label>

<input id="enrollment">


<label>
Section
</label>

<input id="section">


<button onclick="register()">

Save Profile & Mark Attendance

</button>


</div>



<!-- =============================
     ATTENDANCE SCREEN
============================= -->

<div
    id="attendanceScreen"
    style="display:none">


<h1>
Mark Attendance
</h1>


<p
    class="who"
    id="who">
</p>


<div
    id="loading"
    class="loader">
</div>


<div
    id="status"
    class="status">
</div>


<p>

<a
    href="#"
    onclick="
        switchProfile();
        return false;
    ">

Not you? Switch profile

</a>

</p>


</div>


</div>



<script>


/* ===============================
   GET QR TOKEN
================================ */

const params =
    new URLSearchParams(
        window.location.search
    );


const token =
    params.get(
        'token'
    );



/* ===============================
   CHECK QR
================================ */

if (!token) {

    document.getElementById(
        'regForm'
    ).style.display =
        'none';


    document.getElementById(
        'attendanceScreen'
    ).style.display =
        'block';


    document.getElementById(
        'loading'
    ).style.display =
        'none';


    document.getElementById(
        'status'
    ).innerHTML = `

        <p class="error">

        No attendance QR detected.

        </p>

        <p>

        Please scan the QR code
        shown by your teacher.

        </p>

    `;

}



/* ===============================
   EXISTING STUDENT
================================ */

const saved =
    JSON.parse(

        localStorage.getItem(
            'profile'
        ) || 'null'

    );


if (
    saved &&
    token
) {

    showAttendance(
        saved
    );

    markAttendance(
        saved
    );

}



/* ===============================
   REGISTER STUDENT
================================ */

async function register() {


    const name =
        document.getElementById(
            'name'
        ).value.trim();


    const enrollment =
        document.getElementById(
            'enrollment'
        ).value.trim();


    const section =
        document.getElementById(
            'section'
        ).value.trim();



    if (
        !name ||
        !enrollment ||
        !section
    ) {

        alert(
            'Please fill all fields'
        );

        return;

    }



    if (!token) {

        alert(
            'Please scan attendance QR first.'
        );

        return;

    }



    const r =
        await fetch(
            '/api/register',
            {

                method:
                    'POST',

                headers:{

                    'Content-Type':
                        'application/json'

                },

                body:

                    JSON.stringify({

                        name,
                        enrollment,
                        section

                    })

            }
        );



    if (!r.ok) {

        alert(
            'Registration failed'
        );

        return;

    }



    const profile = {

        name,
        enrollment,
        section

    };


    localStorage.setItem(

        'profile',

        JSON.stringify(
            profile
        )

    );


    showAttendance(
        profile
    );


    markAttendance(
        profile
    );

}



/* ===============================
   ATTENDANCE SCREEN
================================ */

function showAttendance(
    profile
) {


    document.getElementById(
        'regForm'
    ).style.display =
        'none';


    document.getElementById(
        'attendanceScreen'
    ).style.display =
        'block';


    document.getElementById(
        'who'
    ).textContent =

        `${profile.name} · ${profile.enrollment}`;

}



/* ===============================
   MARK ATTENDANCE
================================ */

async function markAttendance(
    profile
) {


    const loading =
        document.getElementById(
            'loading'
        );


    const status =
        document.getElementById(
            'status'
        );


    loading.style.display =
        'block';


    status.innerHTML =
        '<p>Checking attendance...</p>';



    try {


        const r =
            await fetch(
                '/api/mark',
                {

                    method:
                        'POST',

                    headers:{

                        'Content-Type':
                            'application/json'

                    },

                    body:

                        JSON.stringify({

                            enrollment:
                                profile.enrollment,

                            token:
                                token

                        })

                }
            );



        const data =
            await r.json();


        loading.style.display =
            'none';



        if (r.ok) {


            if (
                data.already
            ) {


                status.innerHTML = `

                    <span class="stamp">

                    Already Marked

                    </span>

                    <p>

                    ${
                        data.subject
                        ? 'Subject: ' +
                          data.subject
                        : ''
                    }

                    </p>

                `;


            }

            else {


                status.innerHTML = `

                    <span class="stamp">

                    Present

                    </span>

                    <p>

                    Attendance marked successfully.

                    </p>

                    <p>

                    ${
                        data.subject
                        ? 'Subject: ' +
                          data.subject
                        : ''
                    }

                    </p>

                `;

            }


        }

        else {


            status.innerHTML = `

                <p class="error">

                ${data.error}

                </p>

            `;

        }


    }

    catch (error) {


        loading.style.display =
            'none';


        status.innerHTML = `

            <p class="error">

            Unable to connect to attendance server.

            </p>

        `;

    }

}



/* ===============================
   SWITCH STUDENT
================================ */

function switchProfile() {


    localStorage.removeItem(
        'profile'
    );


    location.reload();

}


</script>


</body>

</html>
