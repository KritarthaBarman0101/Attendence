<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>Register Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #faedcd;
            --card: #fffdf7;
            --ink: #432818;
            --rule: #d4a373;
            --stamp: #606c38;
            --bad: #bc4749;
            --muted: #8a7968
        }

        * {
            box-sizing: border-box
        }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--paper);
            background-image: repeating-linear-gradient(to bottom, transparent, transparent 31px, var(--rule) 32px);
            min-height: 100vh;
            margin: 0;
            color: var(--ink)
        }

        .wrap {
            max-width: 600px;
            margin: 0 auto;
            padding: 44px 20px
        }

        .center {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh
        }

        .card {
            background: var(--card);
            padding: 32px;
            border-radius: 4px;
            box-shadow: 0 4px 0 var(--rule), 0 6px 20px rgba(67, 40, 24, .12)
        }

        h1 {
            font-family: 'Fraunces', serif;
            font-weight: 800;
            margin: 0 0 20px;
            font-size: 22px
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--muted);
            margin: 12px 0 4px
        }

        input {
            display: block;
            width: 100%;
            padding: 11px 12px;
            font-size: 15px;
            border-radius: 3px;
            border: 1px solid var(--rule);
            background: #fff;
            color: var(--ink);
            font-family: inherit
        }

        button {
            padding: 11px 18px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: .8px;
            border: none;
            border-radius: 3px;
            background: var(--ink);
            color: var(--paper);
            font-weight: 600;
            cursor: pointer;
            margin-top: 16px;
            font-family: inherit
        }

        button:hover {
            background: var(--stamp)
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: var(--paper);
            border: 1px solid var(--rule);
            border-radius: 4px;
            margin-bottom: 8px
        }

        .danger {
            background: var(--bad);
            color: #fff;
            padding: 6px 12px;
            font-size: 12px;
            margin-top: 0
        }

        .logout {
            float: right;
            background: var(--paper);
            color: var(--ink);
            border: 1px solid var(--rule);
            margin-top: 0
        }
    </style>
</head>

<body>
    <div id="loginBox" class="center">
        <div class="card" style="width:320px">
            <h1>Admin Login</h1>
            <label>Username</label><input id="user">
            <label>Password</label><input id="pass" type="password">
            <button onclick="login()" style="width:100%">Login</button>
            <p id="loginMsg" style="color:var(--bad);font-size:13px"></p>
        </div>
    </div>

    <div id="dash" style="display:none" class="wrap">
        <div class="card">
            <h1>Manage Teachers <button class="logout" onclick="logout()">Logout</button></h1>
            <label>Full name</label><input id="name">
            <label>Username</label><input id="username">
            <label>Password</label><input id="password">
            <button onclick="addTeacher()">Add Teacher</button>
            <div id="list" style="margin-top:22px"></div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('superAdmin')) enterDash();

        async function login() {
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
            if (r.ok) { sessionStorage.setItem('superAdmin', '1'); enterDash(); }
            else document.getElementById('loginMsg').textContent = 'Invalid credentials';
        }
        function logout() { sessionStorage.removeItem('superAdmin'); location.reload(); }
        function enterDash() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('dash').style.display = 'block';
            loadTeachers();
        }
        async function addTeacher() {
            const name = document.getElementById('name').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!name || !username || !password) return alert('fill all fields');
            const r = await fetch('/api/admin/teachers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, username, password }) });
            if (!r.ok) { const d = await r.json(); return alert(d.error); }
            document.getElementById('name').value = document.getElementById('username').value = document.getElementById('password').value = '';
            loadTeachers();
        }
        async function removeTeacher(id) {
            if (!confirm('Remove this teacher?')) return;
            await fetch('/api/admin/teachers/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
            loadTeachers();
        }
        async function loadTeachers() {
            const r = await fetch('/api/admin/teachers');
            const list = await r.json();
            const el = document.getElementById('list');
            el.innerHTML = list.length ? '' : '<p style="color:var(--muted)">No teachers yet.</p>';
            list.forEach(t => {
                const div = document.createElement('div');
                div.className = 'row';
                div.innerHTML = `<div><strong>${t.name}</strong><br><span style="color:var(--muted);font-size:12px">@${t.username}</span></div>
      <button class="danger" onclick="removeTeacher('${t.id}')">Remove</button>`;
                el.appendChild(div);
            });
        }
    </script>
</body>

</html>
