<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Teacher Attendance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- QR Code library -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>

<style>

:root {
    --paper:#faedcd;
    --card:#fffdf7;
    --ink:#432818;
    --rule:#d4a373;
    --stamp:#606c38;
    --bad:#bc4749;
    --muted:#8a7968;
}

* {
    box-sizing:border-box;
}

body {

    font-family:'IBM Plex Mono',monospace;

    background:var(--paper);

    background-image:
        repeating-linear-gradient(
            to bottom,
            transparent,
            transparent 31px,
            var(--rule) 32px
        );

    margin:0;

    color:var(--ink);
}

.layout {

    display:flex;

    min-height:100vh;
}

.sidebar {

    width:210px;

    background:var(--ink);

    padding:28px 0;

    display:flex;

    flex-direction:column;
}

.brand {

    font-family:'Fraunces',serif;

    font-weight:800;

    color:var(--paper);

    font-size:19px;

    margin:
        0 28px 30px 34px;
}

.nav-item {

    padding:
        11px 16px
        11px 34px;

    cursor:pointer;

    color:#c9b599;

    font-size:13.5px;

    text-transform:uppercase;
}

.nav-item.active {

    background:var(--stamp);

    color:white;
}

.logout {

    margin-top:auto;

    color:#e0a0a0;

    cursor:pointer;

    padding:
        11px 16px
        11px 34px;
}

.main {

    flex:1;

    padding:36px 44px;
}

.center {

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:100vh;
}

.card {

    background:var(--card);

    padding:32px;

    border-radius:4px;

    box-shadow:
        0 4px 0 var(--rule),
        0 6px 20px
        rgba(67,40,24,.12);
}

h1 {

    font-family:'Fraunces',serif;

    margin:0 0 2px;

    font-size:24px;
}

.sub {

    color:var(--muted);

    margin:
        0 0 22px;

    font-size:12px;

    text-transform:uppercase;
}

label {

    display:block;

    font-size:11px;

    text-transform:uppercase;

    color:var(--muted);

    margin:
        14px 0 4px;
}

input {

    display:block;

    width:100%;

    padding:11px;

    font-size:15px;

    border:
        1px solid
        var(--rule);

    background:white;

    font-family:inherit;
}

button {

    padding:
        11px 18px;

    border:none;

    border-radius:3px;

    background:var(--ink);

    color:var(--paper);

    font-weight:600;

    cursor:pointer;

    margin:
        16px 8px 4px 0;

    font-family:inherit;
}

button:hover {

    background:
        var(--stamp);
}

button.danger {

    background:
        var(--bad);
}

button.secondary {

    background:
        var(--paper);

    color:
        var(--ink);

    border:
        1px solid
        var(--rule);
}


/* STATS */

.stats {

    display:flex;

    gap:16px;

    margin-bottom:22px;
}

.stat {

    flex:1;

    background:
        var(--card);

    border-left:
        4px solid
        var(--stamp);

    padding:
        16px 18px;
}

.stat .val {

    font-family:
        'Fraunces',
        serif;

    font-size:26px;

    font-weight:800;
}

.stat .label {

    color:
        var(--muted);

    font-size:11px;
}


/* QR */

.qr-area {

    margin:
        20px 0;

    padding:25px;

    border:
        2px dashed
        var(--rule);

    text-align:center;

    border-radius:6px;
}

#qrCode {

    display:flex;

    justify-content:center;

    margin:
        20px auto;
}

.qr-title {

    font-family:
        'Fraunces',
        serif;

    font-size:20px;

    font-weight:800;
}

.qr-message {

    color:
        var(--muted);

    font-size:12px;
}


/* TABLE */

table {

    width:100%;

    border-collapse:
        collapse;

    margin-top:14px;
}

th,
td {

    padding:
        10px 12px;

    text-align:left;

    border-bottom:
        1px solid
        var(--rule);
}

th {

    color:
        var(--muted);

    font-size:11px;
}


/* PRESENT STAMP */

.stamp {

    display:inline-block;

    border:
        2px solid
        var(--stamp);

    color:
        var(--stamp);

    font-family:
        'Fraunces',
        serif;

    font-weight:800;

    padding:
        1px 9px;

    transform:
        rotate(-6deg);
}


/* HISTORY */

.hist-row {

    display:flex;

    justify-content:
        space-between;

    align-items:center;

    padding:
        14px 16px;

    border:
        1px solid
        var(--rule);

    margin-bottom:8px;
}

.badge {

    padding:
        2px 10px;

    background:
        var(--stamp);

    color:white;
}

.badge.closed {

    background:
        #e5d7c3;

    color:
        var(--muted);
}

</style>

</head>


<body>


<!-- LOGIN -->

<div
    id="loginBox"
    class="center">

<div
    class="card"
    style="width:340px">

<h1>
Teacher Login
</h1>

<p class="sub">
Sign in to your register
</p>


<label>
Username
</label>

<input id="user">


<label>
Password
</label>

<input
    id="pass"
    type="password">


<button
    onclick="login()"
    style="width:100%">

Login

</button>


<p
    id="loginMsg"
    style="color:var(--bad)">
</p>

</div>

</div>



<!-- DASHBOARD -->

<div
    id="dash"
    style="display:none"
    class="layout">


<div class="sidebar">

<div class="brand">
📖 Register
</div>

<div
    class="nav-item active"
    id="tabLive"
    onclick="showTab('live')">

Live Session

</div>


<div
    class="nav-item"
    id="tabHist"
    onclick="showTab('history')">

History

</div>


<div
    class="logout"
    onclick="logout()">

Logout

</div>

</div>



<div class="main">


<h1 id="hello"></h1>

<p
    class="sub"
    id="today">
</p>



<div id="liveTab">


<div class="stats">


<div class="stat">

<div
    class="val"
    id="statPresent">
0
</div>

<div class="label">
Present
</div>

</div>



<div class="stat">

<div
    class="val"
    id="statSessions">
0
</div>

<div class="label">
Sessions
</div>

</div>



<div class="stat">

<div
    class="val"
    id="statSubject">
–
</div>

<div class="label">
Subject
</div>

</div>


</div>



<div class="card">


<label>
Subject
</label>


<input
    id="subject"
    placeholder="e.g. Data Structures">


<button
    onclick="startSession()">

Generate QR Code

</button>


<button
    class="danger"
    id="closeBtn"
    onclick="closeSession()"
    style="display:none">

Close Session

</button>



<div
    class="qr-area"
    id="qrArea"
    style="display:none">


<div class="qr-title">
Scan To Mark Attendance
</div>


<div id="qrCode"></div>


<div class="qr-message">

Students must scan this QR using their phone.

</div>


</div>



<table>

<thead>

<tr>

<th>Student</th>

<th>Enrolment</th>

<th>Section</th>

<th>Time</th>

<th>Status</th>

</tr>

</thead>


<tbody id="rows"></tbody>

</table>


</div>

</div>



<!-- HISTORY -->

<div
    id="historyTab"
    style="display:none"
    class="card">

<div id="histList"></div>

</div>


</div>

</div>



<script>

let teacherId = null;

let teacherName = null;


/* ===============================
   SAVED LOGIN
================================ */

const savedAuth =
    JSON.parse(
        localStorage.getItem(
            'teacherAuth'
        ) || 'null'
    );


if (savedAuth) {

    teacherId =
        savedAuth.teacherId;

    teacherName =
        savedAuth.teacherName;

    enterDash();

}



/* ===============================
   LOGIN
================================ */

async function login() {

    const username =
        document.getElementById(
            'user'
        ).value;

    const password =
        document.getElementById(
            'pass'
        ).value;


    const r =
        await fetch(
            '/api/login',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify({
                        username,
                        password
                    })
            }
        );


    const data =
        await r.json();


    if (r.ok) {

        teacherId =
            data.teacherId;

        teacherName =
            data.teacherName;


        localStorage.setItem(
            'teacherAuth',
            JSON.stringify({
                teacherId,
                teacherName
            })
        );


        enterDash();

    }

    else {

        document.getElementById(
            'loginMsg'
        ).textContent =
            data.error;

    }

}



function logout() {

    localStorage.removeItem(
        'teacherAuth'
    );

    location.reload();

}



/* ===============================
   DASHBOARD
================================ */

function enterDash() {

    document.getElementById(
        'loginBox'
    ).style.display =
        'none';


    document.getElementById(
        'dash'
    ).style.display =
        'flex';


    document.getElementById(
        'hello'
    ).textContent =
        teacherName;


    document.getElementById(
        'today'
    ).textContent =
        new Date()
            .toLocaleDateString(
                undefined,
                {
                    weekday:'long',
                    year:'numeric',
                    month:'long',
                    day:'numeric'
                }
            );


    connectStream();

    refreshStats();

}



/* ===============================
   TABS
================================ */

function showTab(tab) {

    document.getElementById(
        'liveTab'
    ).style.display =
        tab === 'live'
            ? 'block'
            : 'none';


    document.getElementById(
        'historyTab'
    ).style.display =
        tab === 'history'
            ? 'block'
            : 'none';


    document.getElementById(
        'tabLive'
    ).classList.toggle(
        'active',
        tab === 'live'
    );


    document.getElementById(
        'tabHist'
    ).classList.toggle(
        'active',
        tab === 'history'
    );


    if (
        tab === 'history'
    ) {

        loadHistory();

    }

}



/* ===============================
   CREATE QR
================================ */

function displayQR(token) {

    const area =
        document.getElementById(
            'qrArea'
        );


    const box =
        document.getElementById(
            'qrCode'
        );


    area.style.display =
        'block';


    box.innerHTML = '';


    /*
       IMPORTANT

       This creates:

       http://server/student.html?token=XXXX

       When phone scans QR,
       student page opens.
    */

    const attendanceURL =

        window.location.origin +

        '/student.html?token=' +

        encodeURIComponent(
            token
        );


    new QRCode(
        box,
        {
            text:
                attendanceURL,

            width:
                230,

            height:
                230,

            correctLevel:
                QRCode.CorrectLevel.H
        }
    );

}



/* ===============================
   START SESSION
================================ */

async function startSession() {

    const subject =
        document.getElementById(
            'subject'
        ).value.trim();


    const r =
        await fetch(
            '/api/start-session',
            {
                method:'POST',

                headers:{
                    'Content-Type':
                        'application/json'
                },

                body:
                    JSON.stringify({
                        teacherId,
                        subject
                    })
            }
        );


    const data =
        await r.json();


    if (!r.ok) {

        alert(
            data.error ||
            'Could not start session'
        );

        return;

    }


    document.getElementById(
        'rows'
    ).innerHTML = '';


    document.getElementById(
        'closeBtn'
    ).style.display =
        'inline-block';


    document.getElementById(
        'statSubject'
    ).textContent =
        subject || '–';


    document.getElementById(
        'statPresent'
    ).textContent =
        '0';


    displayQR(
        data.qrToken
    );


    refreshStats();

}



/* ===============================
   CLOSE SESSION
================================ */

async function closeSession() {

    await fetch(
        '/api/close-session',
        {
            method:'POST',

            headers:{
                'Content-Type':
                    'application/json'
            },

            body:
                JSON.stringify({
                    teacherId
                })
        }
    );


    document.getElementById(
        'closeBtn'
    ).style.display =
        'none';


    document.getElementById(
        'qrArea'
    ).style.display =
        'none';


    document.getElementById(
        'qrCode'
    ).innerHTML = '';

}



/* ===============================
   LIVE STREAM
================================ */

function connectStream() {

    const es =
        new EventSource(
            `/api/stream?teacherId=${teacherId}`
        );


    es.onmessage =
        (e) => {

        const data =
            JSON.parse(
                e.data
            );


        if (
            data.type ===
            'new-session'
        ) {

            document.getElementById(
                'rows'
            ).innerHTML = '';


            document.getElementById(
                'closeBtn'
            ).style.display =
                'inline-block';


            document.getElementById(
                'statSubject'
            ).textContent =
                data.session.subject ||
                '–';


            document.getElementById(
                'statPresent'
            ).textContent =
                '0';


            if (
                data.session.qrToken
            ) {

                displayQR(
                    data.session.qrToken
                );

            }

        }


        if (
            data.type ===
            'closed'
        ) {

            document.getElementById(
                'qrArea'
            ).style.display =
                'none';


            document.getElementById(
                'qrCode'
            ).innerHTML = '';


            document.getElementById(
                'closeBtn'
            ).style.display =
                'none';

        }


        if (
            data.type ===
            'mark'
        ) {

            addRow(
                data.student
            );

            bumpPresent();

        }


        if (
            data.type ===
            'init' &&
            data.session
        ) {

            document.getElementById(
                'rows'
            ).innerHTML = '';


            document.getElementById(
                'closeBtn'
            ).style.display =
                data.session.active
                    ? 'inline-block'
                    : 'none';


            document.getElementById(
                'statSubject'
            ).textContent =
                data.session.subject ||
                '–';


            Object.values(
                data.session.present
            ).forEach(
                s =>
                    addRow(s)
            );


            document.getElementById(
                'statPresent'
            ).textContent =
                Object.keys(
                    data.session.present
                ).length;


            if (
                data.session.qrToken
            ) {

                displayQR(
                    data.session.qrToken
                );

            }

        }

    };

}



/* ===============================
   ADD STUDENT ROW
================================ */

function addRow(s) {

    const tr =
        document.createElement(
            'tr'
        );


    tr.innerHTML = `

        <td>
            ${s.name}
        </td>

        <td>
            ${s.enrollment}
        </td>

        <td>
            ${s.section}
        </td>

        <td>
            ${
                new Date(
                    s.time
                ).toLocaleTimeString()
            }
        </td>

        <td>
            <span class="stamp">
                Present
            </span>
        </td>

    `;


    document.getElementById(
        'rows'
    ).appendChild(
        tr
    );

}



function bumpPresent() {

    const el =
        document.getElementById(
            'statPresent'
        );


    el.textContent =
        Number(
            el.textContent
        ) + 1;

}



/* ===============================
   STATS
================================ */

async function refreshStats() {

    const r =
        await fetch(
            `/api/history?teacherId=${teacherId}`
        );


    const list =
        await r.json();


    document.getElementById(
        'statSessions'
    ).textContent =
        list.length;

}



/* ===============================
   HISTORY
================================ */

async function loadHistory() {

    const r =
        await fetch(
            `/api/history?teacherId=${teacherId}`
        );


    const list =
        await r.json();


    const el =
        document.getElementById(
            'histList'
        );


    el.innerHTML =
        list.length
            ? ''
            : '<p>No sessions yet.</p>';


    list.forEach(
        s => {

        const div =
            document.createElement(
                'div'
            );


        div.className =
            'hist-row';


        div.innerHTML = `

        <div>

        <strong>
        ${s.subject || 'No subject'}
        </strong>

        <br>

        <span>

        ${
            new Date(
                s.createdAt
            ).toLocaleString()
        }

        · ${s.count} present

        </span>

        </div>


        <div>

        <span class="
            badge
            ${s.active ? '' : 'closed'}
        ">

        ${
            s.active
                ? 'active'
                : 'closed'
        }

        </span>


        <button
            class="secondary"
            onclick="
                location.href=
                '/api/export?id=${s.id}'
            ">

        Export

        </button>

        </div>

        `;


        el.appendChild(
            div
        );

    });

}

</script>

</body>
</html>
